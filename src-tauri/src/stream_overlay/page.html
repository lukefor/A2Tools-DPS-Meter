<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>A2Tools DPS Meter overlay</title>
<style>
  :root {
    --row-bg: rgba(10, 12, 16, 0.55);
    --text: #f4f6fa;
    --sub: rgba(244, 246, 250, 0.72);
    --faint: rgba(244, 246, 250, 0.5);
    --you: #ffd166;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
  }
  /* Everything is sized in rem and the rem follows the source's width, so
     resizing the Browser Source in OBS scales the whole meter. */
  html { font-size: clamp(9px, calc(100vw / 24), 64px); }
  body {
    color: var(--text);
    font-family: "Segoe UI", "Noto Sans", "Malgun Gothic", "Yu Gothic UI", "Microsoft YaHei UI", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9), 0 0 4px rgba(0, 0, 0, 0.6);
  }
  .meter { padding: 0.15rem; }
  .head {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    padding: 0.2rem 0.45rem 0.3rem;
  }
  .target {
    flex: 1 1 auto;
    min-width: 0;
    font-weight: 700;
    font-size: 0.95rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hp, .time { flex: 0 0 auto; font-size: 0.8rem; color: var(--sub); }
  .hp:empty, .time:empty { display: none; }
  .rows { display: flex; flex-direction: column; gap: 0.12rem; }
  .row {
    position: relative;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    height: 1.55rem;
    padding: 0 0.45rem 0 0.25rem;
    background: var(--row-bg);
    border-radius: 0.15rem;
    overflow: hidden;
  }
  .fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0;
    opacity: 0.55;
    transition: width 300ms ease-out;
  }
  .fill::after {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 2px;
    background: inherit;
    filter: brightness(1.6);
  }
  .row > :not(.fill) { position: relative; }
  .rank { width: 0.9rem; text-align: right; font-size: 0.7rem; color: var(--faint); }
  .icon { width: 1.15rem; height: 1.15rem; flex: 0 0 auto; object-fit: contain; }
  .icon[hidden] { display: block; visibility: hidden; }
  .name {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 0.85rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row.you .name { color: var(--you); }
  .dmg { font-size: 0.68rem; color: var(--sub); }
  .dps { font-size: 0.85rem; font-weight: 700; min-width: 3.6rem; text-align: right; }
  .pct { font-size: 0.7rem; color: var(--sub); min-width: 2.4rem; text-align: right; }
  .status {
    padding: 0.2rem 0.45rem;
    font-size: 0.75rem;
    color: var(--faint);
  }
  .status:empty { display: none; }
</style>
</head>
<body>
<div class="meter">
  <div class="head" hidden>
    <div class="target"></div>
    <div class="hp"></div>
    <div class="time"></div>
  </div>
  <div class="rows"></div>
  <div class="status"></div>
</div>
<script>
(() => {
  "use strict";
  const CONFIG = __OVERLAY_CONFIG__;
  const params = new URLSearchParams(location.search);
  const key = params.get("key") || "";
  const lang = CONFIG.lang || "en";
  // `&rows=N` caps the rows to what the source is sized for. You stay on it:
  // below the cap, you take the last row.
  const maxRows = Math.min(12, Math.max(0, parseInt(params.get("rows"), 10) || 0));
  const capRows = (rows) => {
    if (!maxRows || rows.length <= maxRows) return rows;
    const shown = rows.slice(0, maxRows);
    const you = rows.findIndex((r) => r && r.you);
    if (you >= maxRows) shown[maxRows - 1] = rows[you];
    return shown;
  };
  const COLORS = {
    gladiator: "#4FD1C5", templar: "#5F8CFF", ranger: "#41D98A", assassin: "#7BE35A",
    sorcerer: "#9A6BFF", cleric: "#F2C15A", spiritmaster: "#E06BFF", chanter: "#FF9A3D",
    brawler: "#E85D5D",
  };
  const FALLBACK_COLOR = "#8a93a6";

  let whole, compact;
  try {
    whole = new Intl.NumberFormat(lang, { maximumFractionDigits: 0 });
    compact = new Intl.NumberFormat(lang, { notation: "compact", maximumFractionDigits: 1 });
  } catch (e) {
    whole = new Intl.NumberFormat("en", { maximumFractionDigits: 0 });
    compact = new Intl.NumberFormat("en", { notation: "compact", maximumFractionDigits: 1 });
  }

  const elHead = document.querySelector(".head");
  const elTarget = document.querySelector(".target");
  const elHp = document.querySelector(".hp");
  const elTime = document.querySelector(".time");
  const elRows = document.querySelector(".rows");
  const elStatus = document.querySelector(".status");
  const views = [];

  const makeRow = () => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML =
      '<div class="fill"></div><span class="rank"></span><img class="icon" alt="" hidden>' +
      '<span class="name"></span><span class="dmg"></span><span class="dps"></span><span class="pct"></span>';
    const q = (s) => row.querySelector(s);
    return { row, fill: q(".fill"), rank: q(".rank"), icon: q(".icon"), name: q(".name"),
             dmg: q(".dmg"), dps: q(".dps"), pct: q(".pct"), cls: null };
  };

  const setText = (el, text) => { if (el.textContent !== text) el.textContent = text; };

  const formatTime = (ms) => {
    const s = Math.max(0, Math.floor((Number(ms) || 0) / 1000));
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  };

  const render = (snap) => {
    const all = Array.isArray(snap && snap.rows) ? snap.rows : [];
    const rows = capRows(all);
    if (rows.length === 0) {
      elHead.hidden = true;
      elRows.replaceChildren();
      views.length = 0;
      setText(elStatus, CONFIG.waiting || "");
      return;
    }
    setText(elStatus, "");
    elHead.hidden = false;
    setText(elTarget, snap.target || "");
    setText(elHp, typeof snap.hp === "number" ? `${snap.hp.toFixed(1)}%` : "");
    setText(elTime, snap.timeMs > 0 ? formatTime(snap.timeMs) : "");

    // Ranks go by DPS whatever the order (the local player may be pinned).
    // Ranked among every row the meter sent, so a row moved up past the
    // `rows` cap keeps its real rank.
    const ranked = all.map((r) => [r, Number(r && r.dps) || 0]).sort((a, b) => b[1] - a[1]);
    const rankOf = new Map(ranked.map(([r], n) => [r, n + 1]));
    const top = Math.max(1, ...rows.map((r) => Number(r.dps) || 0));

    while (views.length < rows.length) {
      const v = makeRow();
      views.push(v);
      elRows.appendChild(v.row);
    }
    while (views.length > rows.length) views.pop().row.remove();

    rows.forEach((r, i) => {
      const v = views[i];
      v.row.classList.toggle("you", !!r.you);
      setText(v.rank, String(rankOf.get(r)));
      // The meter's name for the row; a row without one shows its class.
      const name = r.name ? String(r.name) : (CONFIG.classes || {})[r.cls] || CONFIG.player || "";
      setText(v.name, name);
      setText(v.dps, whole.format(Number(r.dps) || 0) + (CONFIG.dpsSuffix || ""));
      setText(v.dmg, compact.format(Number(r.dmg) || 0));
      setText(v.pct, `${(Number(r.pct) || 0).toFixed(1)}%`);
      const cls = typeof r.cls === "string" && COLORS[r.cls] ? r.cls : null;
      if (v.cls !== cls) {
        v.cls = cls;
        v.fill.style.background = cls ? COLORS[cls] : FALLBACK_COLOR;
        if (cls) {
          v.icon.src = `/overlay/class/${cls}.png?key=${encodeURIComponent(key)}`;
          v.icon.hidden = false;
        } else {
          v.icon.removeAttribute("src");
          v.icon.hidden = true;
        }
      }
      v.fill.style.width = `${Math.min(100, ((Number(r.dps) || 0) / top) * 100).toFixed(2)}%`;
    });
  };

  // EventSource retries a dropped stream by itself, but gives up for good on
  // an error response or while the meter is closed for long; so on any
  // error it is replaced after a pause. Covers the meter restarting.
  let source = null;
  let retryTimer = 0;
  let lostTimer = 0;
  const connect = () => {
    retryTimer = 0;
    if (source) source.close();
    source = new EventSource(`/overlay/events?key=${encodeURIComponent(key)}`);
    source.onopen = () => {
      clearTimeout(lostTimer);
      lostTimer = 0;
      if (elStatus.textContent === CONFIG.reconnecting) setText(elStatus, CONFIG.waiting || "");
    };
    source.onmessage = (event) => {
      try { render(JSON.parse(event.data)); } catch (e) { /* keep the last frame */ }
    };
    source.onerror = () => {
      if (!lostTimer) {
        lostTimer = setTimeout(() => {
          elHead.hidden = true;
          elRows.replaceChildren();
          views.length = 0;
          setText(elStatus, CONFIG.reconnecting || "");
        }, 4000);
      }
      if (!retryTimer) {
        source.close();
        retryTimer = setTimeout(connect, 3000);
      }
    };
  };
  setText(elStatus, CONFIG.waiting || "");
  connect();
})();
</script>
</body>
</html>
