<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Widget</title>
    <style>
      /* A plugin widget's host page: nothing but the widget's own frame, on a
         transparent window. */
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
      iframe { display: block; width: 100%; height: 100%; border: 0; background: transparent; }
    </style>
  </head>
  <body>
    <script src="/src/js/pluginWidget.js"></script>
  </body>
</html>
