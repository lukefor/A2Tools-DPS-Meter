<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A2Tools Plugins</title>
    <link rel="stylesheet" href="/src/js/pluginHost.css" />
    <link rel="stylesheet" href="/src/js/pluginDock.css" />
  </head>
  <body class="pluginDockPage">
    <header class="pluginBar dockBar">
      <div class="dockTabs" role="tablist"></div>
      <input type="range" class="pluginOpacity" min="20" max="100" step="5" value="100" aria-label="Background opacity" title="Background opacity" />
      <button type="button" class="pluginMeter" aria-label="Hide the DPS meter" title="Hide the DPS meter" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 16V11"/><path d="M12 16V7"/><path d="M17 16v-3"/></svg>
      </button>
      <button type="button" class="pluginSettings" aria-label="Plugin settings" title="Plugin settings">
        <i data-lucide="puzzle" aria-hidden="true"></i>
      </button>
      <button type="button" class="dockLayout" aria-label="Stack the plugins" title="Stack the plugins" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="7" rx="1"/><rect x="3" y="14" width="18" height="7" rx="1"/></svg>
      </button>
      <button type="button" class="dockFold" aria-label="Fold the dock" title="Fold the dock" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg>
      </button>
      <button type="button" class="pluginClose" aria-label="Hide the dock (the plugins keep running)" title="Hide the dock (the plugins keep running)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </header>
    <main class="pluginStage dockStage"></main>
    <div class="pluginToast" role="status" hidden></div>
    <template class="dockPanelTemplate">
      <section class="dockPanel" role="tabpanel">
        <div class="dockPanelBar">
          <span class="dockPanelName"></span>
          <button type="button" class="dockPanelCompact" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h10"/><path d="M4 18h6"/></svg>
          </button>
          <button type="button" class="dockPanelPopOut">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
          </button>
          <button type="button" class="dockPanelHide">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <div class="dockFrame"></div>
      </section>
    </template>
    <script src="/vendor/lucide.min.js"></script>
    <script src="/src/js/pluginIcons.js"></script>
    <script src="/src/js/pluginFrame.js"></script>
    <script src="/src/js/pluginDock.js"></script>
  </body>
</html>
